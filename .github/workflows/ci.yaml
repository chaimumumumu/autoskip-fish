name: Build AutoSkip APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: download source
        run: |
          curl -sL -X POST https://temp.sh/cxtPt/AutoSkip-source.zip -o src.zip
          unzip -o src.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: build apk
        run: gradle -p AutoSkip assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSkip-apk
          path: AutoSkip/app/build/outputs/apk/debug/*.apk
